# Production reverse proxy for the Vite SPA.
# - Serves the built frontend (same origin, so no CORS issues).
# - Proxies /api/* to the backend Compose service.
# - Falls back to index.html for React Router client-side routes.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API (Compose service name; NOT localhost).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router: serve index.html for unknown paths.
    # NOTE: $uri/ is deliberately omitted. Vite emits its bundle under
    # /assets/, which would otherwise collide with the /assets SPA route
    # (nginx issues a directory redirect instead of serving index.html).
    location / {
        try_files $uri /index.html;
    }
}
